<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>3D Menü Demo</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 10px 0;
      font-size: 28px;
    }

    p {
      margin: 0 0 20px;
      color: #666;
      font-size: 16px;
    }

    model-viewer {
      width: 100%;
      height: 65vh;
      min-height: 400px;
      background: #e8e8e8;
      border-radius: 20px;
      overflow: hidden;
    }

    button {
      width: calc(100% - 40px);
      max-width: 400px;
      margin: 20px;
      padding: 17px 25px;
      border: none;
      border-radius: 14px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>3D Menü Demo</h1>

    <p>Yastığı 3D olarak inceleyebilir ve masanda görebilirsin.</p>

    <model-viewer
      src="21.08.2026.glb"
      alt="3D yastık modeli"
      camera-controls
      auto-rotate
      ar
      ar-modes="quick-look"
      shadow-intensity="1"
      exposure="1">
    </model-viewer>

    <button
      onclick="document.querySelector('model-viewer').activateAR()">
      Masamda Gör
    </button>

  </div>

</body>
</html>
